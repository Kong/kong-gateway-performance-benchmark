# Basic values.yaml configuration for Kong for Kubernetes (with the ingress controller)

env:
  prefix: /kong_prefix/
  database: "off"
  anonymous_reports: "off"

proxy:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8100"

manager:
  enabled: false

admin:
  enabled: false

ingressController:
  enabled: true

nodeSelector:
  benchmark.konghq.com/node-role: kong

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "kong"
    effect: "NoSchedule"
