apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-benchmark-static-chat
  namespace: upstream
  annotations:
    konghq.com/plugins: ai-benchmark-static-chat
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - backend:
              service:
                name: static-openai-mock
                port:
                  number: 8080
            path: /bench/static/chat
            pathType: ImplementationSpecific
---
