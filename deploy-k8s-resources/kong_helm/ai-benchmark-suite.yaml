apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-benchmark-static-chat
  namespace: upstream
  annotations:
    kubernetes.io/ingress.class: kong
plugin: ai-proxy-advanced
config:
  llm_format: openai
  response_streaming: deny
  max_request_body_size: 1048576
  model_name_header: true
  balancer:
    algorithm: round-robin
    retries: 1
    slots: 1000
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
  targets:
    - route_type: llm/v1/chat
      auth:
        allow_override: false
      logging:
        log_payloads: false
        log_statistics: true
      model:
        provider: openai
        name: wiremock-static-chat
        options:
          upstream_url: http://static-openai-mock.upstream.svc.cluster.local:8080/v1/chat/completions
---
