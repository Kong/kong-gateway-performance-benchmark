# Kong plugin and route configurations for advanced routing benchmarks.
#
# Covers:
#   AIGW-PERF-101  Multi-model round-robin (2 / 10 / 50 targets)
#   AIGW-PERF-102  Lowest-latency / EWMA routing
#   AIGW-PERF-104  Failover (primary returns 5xx, fallback succeeds)
#
# All routes point to fake-provider in the upstream namespace.
# Activate with:
#   kubectl apply -f deploy-k8s-resources/kong_helm/ai-routing-benchmark.yaml

# ---------------------------------------------------------------------------
# AIGW-PERF-101a  Round-robin with 2 targets
# ---------------------------------------------------------------------------
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-benchmark-roundrobin-2
  namespace: upstream
  annotations:
    kubernetes.io/ingress.class: kong
plugin: ai-proxy-advanced
config:
  llm_format: openai
  response_streaming: deny
  max_request_body_size: 1048576
  model_name_header: true
  balancer:
    algorithm: round-robin
    retries: 1
    slots: 1000
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
  targets:
    - route_type: llm/v1/chat
      weight: 1
      model:
        provider: openai
        name: mock-gpt-4o-mini
        options:
          upstream_url: http://fake-provider.upstream.svc.cluster.local:8080/v1/chat/completions
      auth:
        allow_override: false
      logging:
        log_payloads: false
        log_statistics: false
    - route_type: llm/v1/chat
      weight: 1
      model:
        provider: openai
        name: mock-gpt-4o-mini-b
        options:
          upstream_url: http://fake-provider.upstream.svc.cluster.local:8080/v1/chat/completions
      auth:
        allow_override: false
      logging:
        log_payloads: false
        log_statistics: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-benchmark-roundrobin-2
  namespace: upstream
  annotations:
    konghq.com/plugins: ai-benchmark-roundrobin-2
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - backend:
              service:
                name: fake-provider
                port:
                  number: 8080
            path: /bench/routing/roundrobin/2
            pathType: ImplementationSpecific
---
