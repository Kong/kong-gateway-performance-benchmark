# Basic values.yaml for Kong for Kubernetes with Kong Enterprise
# Several settings (search for the string "CHANGEME") require user-provided
# Secrets. These Secrets must be created before installation.
#
# This installation does not create an Ingress or LoadBalancer Service for
# the Admin API or Kong Manager. They require port-forwards to access without
# further configuration to add them:
# kubectl port-forward deploy/your-deployment-kong 8001:8001 8002:8002

proxy:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8100"

# KIC is bypassed (see ingressController below); enable the admin API on an
# internal ClusterIP so declarative config can be pushed to /config directly.
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001
  tls:
    enabled: false

manager:
  enabled: false

enterprise:
  enabled: true
  license_secret: kong-enterprise-license
  vitals:
    enabled: false
  portal:
    enabled: false
  rbac:
    enabled: false
  smtp:
    enabled: false

portal:
  enabled: false

portalapi:
  enabled: false

env:
  prefix: /kong_prefix/
  database: "off"
  anonymous_reports: "off"

# Load the AI benchmark routes from the kong-declarative ConfigMap at startup so
# the DB-less config persists across Kong pod restarts (the chart mounts it and
# sets KONG_DECLARATIVE_CONFIG). Routes can still be hot-reloaded via POST /config.
dblessConfig:
  configMap: kong-declarative

# Bypass the Kong Ingress Controller: it hangs at "Getting the kong admin api
# client configuration" against this AI-gateway dev image (KIC 3.5.9), which
# blocks the whole release. Run Kong standalone DB-less instead and load routes
# by pushing a declarative config to the admin API /config endpoint.
ingressController:
  enabled: false

nodeSelector:
  benchmark.konghq.com/node-role: kong

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "kong"
    effect: "NoSchedule"
