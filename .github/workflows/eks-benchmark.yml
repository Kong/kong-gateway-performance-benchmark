name: EKS AI Gateway Benchmark

# Manual trigger only — this provisions real, expensive EKS infrastructure
# (including c5.metal nodes) and tears it down at the end of the run.
#
# Two modes (input `run_mode`):
#   release (default) — release benchmark: run_release_baseline*.sh over the matrix in
#                       release_matrix.yaml (tier1 = per-build subset, tier2 = everything) x repeats,
#                       compare against a previous run's artifact, generate PDF report.
#   adhoc             — the original behaviour: run only the scenarios listed in `scenarios`.
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "release = full matrix + compare + PDF report; adhoc = only the scenarios listed below"
        type: choice
        options:
          - release
          - adhoc
        default: release
      kong_repository:
        description: "Kong image repository"
        type: string
        default: "kong/kong-ai-gateway-dev"
      kong_version:
        description: "Kong image tag (e.g. 2.3.0-rc.2)"
        type: string
        default: "ai-2.0.0-rc.2"
      kong_effective_semver:
        description: "Semantic version for non-semver/dev tags (Helm image.effectiveSemver). Leave blank for release tags."
        type: string
        default: "2.0.0"
      region:
        description: "AWS region"
        type: string
        default: "us-west-2"
      teardown:
        description: "Run terraform destroy after the benchmark (uncheck to keep the cluster for inspection)"
        type: boolean
        default: true
      # ---- release mode only ----
      release_label:
        description: "[release] Version label used for the results dir / report. Blank = ai-<kong_version>."
        type: string
        default: ""
      tier:
        description: "[release] tier1 = cheap per-build subset (gateway/direct overhead pairs); tier2 = every enabled scenario (per release). See release_matrix.yaml."
        type: choice
        options:
          - tier2
          - tier1
        default: tier2
      confirm_rerun:
        description: "[release] Re-run the scenarios flagged REGRESSION/UNSTABLE/over the overhead budget once and only count findings that reproduce (the runner skips it when more than 8 are flagged)"
        type: boolean
        default: true
      repeats:
        description: "[release] Repeats per scenario. 6 repeats of tier2 do NOT fit in the 6h hosted-runner limit (see runtime check)."
        type: string
        default: "3"
      duration:
        description: "[release] Duration per run, whole minutes, e.g. 3m"
        type: string
        default: "3m"
      include_mlflow50_track:
        description: "[release] Include the mlflow50 fixed-delay track (6 extra scenarios)"
        type: boolean
        default: true
      gates_profile:
        description: "[release] Regression gate profile"
        type: choice
        options:
          - non_dedicated
          - default
        default: non_dedicated
      baseline_run_id:
        description: "[release] Run ID of a previous release-mode run whose `release-results` artifact is the baseline. Blank = no comparison (this run becomes the reference)."
        type: string
        default: ""
      fail_on_regression:
        description: "[release] Fail the job if the verdict is REGRESSION / UNSTABLE / ABSOLUTE_SLO_FAIL"
        type: boolean
        default: false
      ignore_runtime_estimate:
        description: "[release] Do not abort when the estimated runtime exceeds the 6h job limit"
        type: boolean
        default: false
      # ---- adhoc mode only ----
      scenarios:
        description: >-
          [adhoc] One benchmark invocation per line, passed verbatim to run_ai_benchmark.sh.
          Example: "token-chat-openai short 25 6m"
        type: string
        default: "token-chat-openai short 5 1m"

# Only one benchmark run at a time — they share IAM role names and would collide.
concurrency:
  group: eks-benchmark
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # needed to download the baseline artifact of a previous run

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Cluster create (~20m) + deploy (~10m) + tests + teardown. 360m is the hosted-runner maximum.
    timeout-minutes: 360
    env:
      AWS_DEFAULT_REGION: ${{ inputs.region }}
      TF_VAR_region: ${{ inputs.region }}
      # On the high-permission CI account we let Terraform create the IAM roles,
      # OIDC provider and EBS CSI add-on natively — no role reuse / workarounds.
      TF_VAR_enable_irsa: "true"
      TF_VAR_enable_ebs_csi_addon: "true"
      TF_IN_AUTOMATION: "true"

    steps:
      # Checkout comes first because the run-time estimate is computed by the matrix planner in the repo.
      - name: Checkout
        uses: actions/checkout@v4

      # Validate release-mode inputs BEFORE spending money on a cluster. Inputs are
      # passed through env vars (never interpolated into the script) and strictly checked.
      - name: Validate inputs
        if: inputs.run_mode == 'release'
        env:
          REPEATS: ${{ inputs.repeats }}
          DURATION: ${{ inputs.duration }}
          MLFLOW: ${{ inputs.include_mlflow50_track }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          IGNORE_EST: ${{ inputs.ignore_runtime_estimate }}
          TIER: ${{ inputs.tier }}
          CONFIRM: ${{ inputs.confirm_rerun }}
        run: |
          set -euo pipefail
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::repeats must be a positive integer"; exit 1; }
          [[ "$DURATION" =~ ^[1-9][0-9]*m$ ]] || { echo "::error::duration must be whole minutes like 3m"; exit 1; }
          [[ -z "$BASELINE_RUN_ID" || "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::baseline_run_id must be numeric"; exit 1; }
          [[ -z "$RELEASE_LABEL" || "$RELEASE_LABEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::release_label may only contain [A-Za-z0-9._-]"; exit 1; }
          [[ "$TIER" =~ ^tier[12]$ ]] || { echo "::error::tier must be tier1 or tier2"; exit 1; }

          # The scenario count comes from the matrix planner (release_matrix.yaml), not from a number
          # hard-coded here, so the estimate cannot drift away from what the runner will actually execute.
          # Use the system PyYAML when there is one; otherwise a throw-away venv (system pip may refuse
          # to install: PEP 668 "externally-managed-environment").
          PY=python3
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/planner-venv"
            "$RUNNER_TEMP/planner-venv/bin/pip" install --quiet pyyaml
            PY="$RUNNER_TEMP/planner-venv/bin/python"
          fi
          summary=$("$PY" deploy-k8s-resources/k6_tests/release_matrix.py summary \
            --tier "$TIER" --repeats "$REPEATS" --include-mlflow50 "$MLFLOW" --duration "$DURATION")
          run_minutes=$(sed -n 's/.*est_minutes=\([0-9][0-9]*\).*/\1/p' <<< "$summary")
          [[ "$run_minutes" =~ ^[0-9]+$ ]] || { echo "::error::could not read the estimate from: $summary"; exit 1; }
          # per-run overhead (~1 min) is already in est_minutes; add ~40 min for cluster create/deploy/destroy
          est=$(( run_minutes + 40 ))
          # The confirmation re-run only happens when something is flagged. Reserve time for the usual case, one
          # flagged scenario plus its direct control (2 scenarios x repeats x (duration + 1 min)); if more are
          # flagged the job can still run out of time, so keep an eye on the first-pass report.
          reserve=0
          if [ "$CONFIRM" = "true" ]; then reserve=$(( 2 * REPEATS * (${DURATION%m} + 1) )); fi
          est=$(( est + reserve ))
          echo "Plan: ${summary}"
          echo "Estimated runtime: ${est} min (${run_minutes} min of runs + 40 min infrastructure + ${reserve} min reserved for a confirmation re-run); job limit 360 min"
          echo "### Runtime estimate: ${est} min (limit 360)" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan: \`${summary}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$est" -gt 345 ] && [ "$IGNORE_EST" != "true" ]; then
            echo "::error::Estimated ${est} min exceeds the 360 min hosted-runner limit. Use tier1, lower repeats/duration, disable the mlflow50 track, or set ignore_runtime_estimate."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup yq (mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # Python deps for compare_release.py (pyyaml) and generate_perf_report.py (PDF).
      - name: Setup Python report dependencies
        if: inputs.run_mode == 'release'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0
          # A venv, because system pip may refuse to install (PEP 668). Putting it on PATH makes every later
          # step's `python3` (planner, aggregate, compare, report) use it.
          python3 -m venv "$RUNNER_TEMP/report-venv"
          "$RUNNER_TEMP/report-venv/bin/pip" install --quiet pyyaml matplotlib numpy weasyprint
          echo "$RUNNER_TEMP/report-venv/bin" >> "$GITHUB_PATH"

      # ---------- Phase 1: provision EKS cluster ----------
      - name: Terraform apply — EKS cluster
        working-directory: provision-eks-cluster
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: |
          aws eks --region "${{ inputs.region }}" update-kubeconfig --name "$CLUSTER_NAME"

      - name: Wait for nodes Ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=15m
          kubectl get nodes -L benchmark.konghq.com/node-role

      # ---------- Phase 2: deploy Kong + test infrastructure ----------
      - name: Write Kong license
        run: |
          printf '%s' '${{ secrets.KONG_LICENSE }}' > deploy-k8s-resources/kong_helm/license.json
          test -s deploy-k8s-resources/kong_helm/license.json

      - name: Terraform apply — Kong + k6 + observability
        working-directory: deploy-k8s-resources
        env:
          TF_VAR_kong_enterprise: "true"
          TF_VAR_kong_repository: ${{ inputs.kong_repository }}
          TF_VAR_kong_version: ${{ inputs.kong_version }}
          TF_VAR_kong_effective_semver: ${{ inputs.kong_effective_semver }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Wait for Kong and k6 operator
        run: |
          kubectl rollout status -n kong deploy --timeout=10m --all || true
          kubectl get pods -A

      # ---------- Phase 3: AI routing config ----------
      - name: Apply AI benchmark routes
        working-directory: deploy-k8s-resources/kong_helm
        run: |
          for f in ai-benchmark-suite.yaml ai-benchmark-policy-suite.yaml \
                   ai-routing-benchmark.yaml ai-logging-benchmark.yaml; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f is not in deploy-k8s-resources/kong_helm - skipped"
            elif ! kubectl apply -f "$f"; then
              echo "::warning::kubectl apply failed for $f - continuing (routes are also loaded from the kong-declarative ConfigMap)"
            fi
          done

      # ---------- Phase 4a (adhoc): run the listed scenarios ----------
      - name: Run benchmark scenarios
        if: inputs.run_mode == 'adhoc'
        working-directory: deploy-k8s-resources/k6_tests
        env:
          KONG_VERSION: ${{ inputs.kong_version }}
        run: |
          set -euo pipefail
          # Each non-empty line of the input is one scenario invocation.
          echo "${{ inputs.scenarios }}" | while IFS= read -r line; do
            [ -z "$(echo "$line" | tr -d '[:space:]')" ] && continue
            echo "::group::run_ai_benchmark.sh $line"
            bash run_ai_benchmark.sh $line
            # Wait for the k6 TestRun job to finish before starting the next one.
            kubectl wait --for=condition=complete -n k6 job \
              -l k6_cr=k6-ai-benchmark --timeout=20m || \
              kubectl logs -n k6 -l k6_cr=k6-ai-benchmark --all-containers=true --tail=200
            echo "::endgroup::"
          done

      # ---------- Phase 4b (release): full matrix, compare, PDF ----------
      - name: Fetch baseline from previous run
        if: inputs.run_mode == 'release' && inputs.baseline_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          dl=$(mktemp -d)
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n release-results -D "$dl"
          metrics=$(find "$dl" -name metrics.json | head -1)
          [ -n "$metrics" ] || { echo "::error::no metrics.json in baseline artifact of run $BASELINE_RUN_ID"; exit 1; }
          src=$(dirname "$metrics")
          name="baseline-ref_$(basename "$src")"
          dest="deploy-k8s-resources/k6_tests/results/releases/$name"
          mkdir -p "$dest"
          cp -r "$src"/. "$dest"/
          version=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$dest/metrics.json")
          # run_release_baseline.sh auto-diffs against whatever baseline.json points at.
          printf '{"dir": "results/releases/%s", "version": "%s"}\n' "$name" "$version" \
            > deploy-k8s-resources/k6_tests/results/releases/baseline.json
          echo "Baseline: $name (version $version)"
          echo "### Baseline: \`$version\` (run $BASELINE_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run release benchmark matrix
        if: inputs.run_mode == 'release'
        working-directory: deploy-k8s-resources/k6_tests
        env:
          KONG_VERSION_TAG: ${{ inputs.kong_version }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          REPEATS: ${{ inputs.repeats }}
          DURATION: ${{ inputs.duration }}
          INCLUDE_MLFLOW50_TRACK: ${{ inputs.include_mlflow50_track }}
          GATES_PROFILE: ${{ inputs.gates_profile }}
          TIER: ${{ inputs.tier }}
          CONFIRM_RERUN: ${{ inputs.confirm_rerun }}
        run: |
          set -uo pipefail
          VERSION="${RELEASE_LABEL:-ai-${KONG_VERSION_TAG#ai-}}"
          export VERSION REPEATS DURATION INCLUDE_MLFLOW50_TRACK TIER CONFIRM_RERUN
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p results/releases
          if [ "$GATES_PROFILE" = "non_dedicated" ]; then
            bash run_release_baseline_non_dedicated.sh
          else
            bash run_release_baseline.sh
          fi
          # The script's own exit code only reflects the last step; the verdict is
          # evaluated by the "Evaluate verdict" step below.
          outdir=$(ls -dt results/releases/"${VERSION}"_* 2>/dev/null | head -1 || true)
          [ -n "$outdir" ] && [ -f "$outdir/metrics.json" ] || { echo "::error::no results produced for $VERSION"; exit 1; }
          echo "RELEASE_OUTDIR=$outdir" >> "$GITHUB_ENV"

      - name: Generate PDF report
        if: inputs.run_mode == 'release' && success()
        working-directory: deploy-k8s-resources/k6_tests
        env:
          REPEATS: ${{ inputs.repeats }}
          DURATION: ${{ inputs.duration }}
          REGION: ${{ inputs.region }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          K8S_VERSION=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" --query cluster.version --output text)
          mkdir -p "$GITHUB_WORKSPACE/artifacts/release"
          python3 ../../generate_perf_report.py "$RELEASE_OUTDIR" \
            "$GITHUB_WORKSPACE/artifacts/release/kong-ai-gateway-perf-report-${RELEASE_VERSION}.pdf" \
            --cluster-name "$CLUSTER_NAME" --k8s-version "$K8S_VERSION" --region "$REGION" \
            --repeats "$REPEATS" --duration "$DURATION" \
            --prepared-by "$ACTOR (GitHub Actions run $GITHUB_RUN_ID)"
          [ -f "$RELEASE_OUTDIR/report.md" ] && cat "$RELEASE_OUTDIR/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      # ---------- Collect + upload ----------
      - name: Collect results (adhoc)
        if: always() && inputs.run_mode == 'adhoc'
        run: |
          mkdir -p artifacts
          cp -r deploy-k8s-resources/k6_tests/results artifacts/ 2>/dev/null || true
          kubectl logs -n k6 -l k6_cr=k6-ai-benchmark --all-containers=true --tail=-1 \
            > artifacts/k6-logs.txt 2>/dev/null || true
          kubectl get pods -A -o wide > artifacts/pods.txt 2>/dev/null || true

      - name: Upload results artifact (adhoc)
        if: always() && inputs.run_mode == 'adhoc'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/
          if-no-files-found: warn

      # `release-results` holds exactly one results dir (+ the PDF) so a later run can
      # use it as its baseline via `baseline_run_id`.
      - name: Collect results (release)
        if: always() && inputs.run_mode == 'release'
        run: |
          mkdir -p artifacts/release
          if [ -n "${RELEASE_OUTDIR:-}" ] && [ -d "deploy-k8s-resources/k6_tests/$RELEASE_OUTDIR" ]; then
            cp -r "deploy-k8s-resources/k6_tests/$RELEASE_OUTDIR" artifacts/release/
          fi
          kubectl get pods -A -o wide > artifacts/release/pods.txt 2>/dev/null || true

      - name: Upload results artifact (release)
        if: always() && inputs.run_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-results
          path: artifacts/release/
          if-no-files-found: warn

      # ---------- Phase 5: teardown ----------
      - name: Terraform destroy — deploy layer
        if: always() && inputs.teardown
        working-directory: deploy-k8s-resources
        run: terraform destroy -auto-approve -input=false || true

      - name: Terraform destroy — EKS cluster
        if: always() && inputs.teardown
        working-directory: provision-eks-cluster
        run: terraform destroy -auto-approve -input=false || true

      # Last on purpose: a failing gate must not skip artifact upload or teardown.
      - name: Evaluate verdict
        if: inputs.run_mode == 'release' && always() && env.RELEASE_OUTDIR != ''
        env:
          FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
        run: |
          set -euo pipefail
          v="deploy-k8s-resources/k6_tests/$RELEASE_OUTDIR/verdict.json"
          [ -f "$v" ] || { echo "::warning::no verdict.json"; exit 0; }
          overall=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("overall","N/A"))' "$v")
          echo "Overall verdict: $overall"
          echo "### Overall verdict: **$overall**" >> "$GITHUB_STEP_SUMMARY"
          case "$overall" in
            REGRESSION|UNSTABLE|ABSOLUTE_SLO_FAIL)
              if [ "$FAIL_ON_REGRESSION" = "true" ]; then
                echo "::error::Release verdict $overall"
                exit 1
              fi
              echo "::warning::Release verdict $overall (fail_on_regression is off)"
              ;;
          esac
